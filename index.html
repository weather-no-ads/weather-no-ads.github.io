<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather No Ads - Fast, Accurate, Ad-Free Weather Forecasts</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Get clean, fast, and 100% ad-free weather forecasts powered by Open-Meteo. View 24-hour temperature trends, 7-day forecasts, rain chances, and sunrise/sunset times without clutter or ads.">
    <meta name="keywords" content="weather, ad-free weather, no ads weather, live weather forecast, temperature trend, 7 day forecast, precipitation chance, local weather">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Weather No Ads">
    
    <!-- Open Graph / Facebook SEO -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Weather No Ads - Clean & Ad-Free Weather Dashboard">
    <meta property="og:description" content="Accurate, real-time weather forecasts without annoying ads, popups, or tracking clutter. Powered by Open-Meteo.">
    <meta property="og:site_name" content="Weather No Ads">

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Weather No Ads - Clean & Ad-Free Weather Dashboard">
    <meta name="twitter:description" content="Accurate, real-time weather forecasts without annoying ads, popups, or tracking clutter.">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js for temperature trends -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        glass: {
                            light: 'rgba(255, 255, 255, 0.15)',
                            dark: 'rgba(15, 23, 42, 0.65)',
                            border: 'rgba(255, 255, 255, 0.1)',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-panel-hover:hover {
            background: rgba(30, 41, 59, 0.7);
            border-color: rgba(255, 255, 255, 0.2);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.2);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-100 flex flex-col min-h-screen justify-between">

    <header class="max-w-7xl mx-auto w-full mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
        <!-- Logo -->
        <div class="flex items-center gap-3">
            <div class="p-3 bg-indigo-600/30 rounded-2xl border border-indigo-500/30 text-indigo-400">
                <i data-lucide="cloud-sun" class="w-8 h-8"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">Weather No Ads</h1>
                <p class="text-xs text-slate-400">Powered by Open-Meteo</p>
            </div>
        </div>

        <!-- Search Bar & Controls -->
        <div class="flex items-center gap-3 w-full md:w-auto">
            <!-- Search Container -->
            <div class="relative flex-1 md:w-80">
                <div class="relative flex items-center">
                    <i data-lucide="search" class="absolute left-3.5 w-4 h-4 text-slate-400 pointer-events-none"></i>
                    <input type="text" id="cityInput" placeholder="Search city or location..." 
                           class="w-full pl-10 pr-10 py-2.5 rounded-xl glass-panel text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition duration-200"
                           autocomplete="off">
                    <button id="clearSearch" class="hidden absolute right-3 text-slate-400 hover:text-slate-200">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
                <!-- Search Suggestions Dropdown -->
                <div id="searchResults" class="hidden absolute top-full left-0 right-0 mt-2 z-50 glass-panel rounded-xl overflow-hidden shadow-2xl max-h-60 overflow-y-auto"></div>
            </div>

            <!-- Current Location Button -->
            <button id="locBtn" title="Use Current Location" class="p-2.5 rounded-xl glass-panel glass-panel-hover text-slate-300 hover:text-white transition duration-200">
                <i data-lucide="locate-fixed" class="w-5 h-5"></i>
            </button>

            <!-- Temperature Unit Toggle -->
            <div class="flex items-center bg-slate-900/60 p-1 rounded-xl border border-white/10">
                <button id="celsiusBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">°C</button>
                <button id="fahrenheitBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition">°F</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full flex-1 flex flex-col gap-6">

        <!-- Loading State Spinner -->
        <div id="loadingState" class="hidden flex-1 flex flex-col items-center justify-center py-20 gap-4">
            <div class="w-12 h-12 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
            <p class="text-sm text-slate-400 animate-pulse">Fetching fresh weather data...</p>
        </div>

        <!-- Error State Alert -->
        <div id="errorState" class="hidden glass-panel border-red-500/30 p-6 rounded-2xl text-center max-w-md mx-auto my-12">
            <i data-lucide="alert-triangle" class="w-10 h-10 text-red-400 mx-auto mb-3"></i>
            <h3 class="text-lg font-semibold text-white mb-1">Location Error</h3>
            <p id="errorMessage" class="text-sm text-slate-300 mb-4">Unable to fetch weather info.</p>
            <button onclick="fetchDefaultCity()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium rounded-xl transition">Reset to Default</button>
        </div>

        <!-- Main Weather Grid Content -->
        <div id="weatherContent" class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Left Column: Current Overview & Highlights (2 cols on LG) -->
            <div class="lg:col-span-2 flex flex-col gap-6">

                <!-- Current Weather Card -->
                <div class="glass-panel rounded-3xl p-6 sm:p-8 relative overflow-hidden flex flex-col justify-between">
                    <!-- Subtle Background Glow -->
                    <div class="absolute -top-24 -right-24 w-64 h-64 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>

                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h2 id="locationName" class="text-2xl sm:text-3xl font-bold text-white flex items-center gap-2">
                                <span id="cityName">--</span>
                                <span id="countryCode" class="text-sm px-2 py-0.5 rounded-md bg-white/10 text-slate-300 font-normal">--</span>
                            </h2>
                            <p id="currentDate" class="text-xs sm:text-sm text-slate-400 mt-1">--</p>
                        </div>
                        <div class="text-right">
                            <span id="weatherConditionTag" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                                Clear
                            </span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 items-center gap-6 my-4">
                        <div class="flex items-center gap-4">
                            <div id="currentIconContainer" class="p-4 bg-white/5 rounded-2xl border border-white/10 text-yellow-400">
                                <i data-lucide="sun" class="w-16 h-16 sm:w-20 sm:h-20"></i>
                            </div>
                            <div>
                                <div class="text-5xl sm:text-7xl font-extrabold tracking-tight text-white flex items-start">
                                    <span id="currentTemp">--</span>
                                    <span id="tempUnitDisplay" class="text-2xl sm:text-3xl text-indigo-400 mt-1">°C</span>
                                </div>
                            </div>
                        </div>

                        <!-- Secondary Quick Metrics -->
                        <div class="grid grid-cols-2 gap-3 p-4 bg-slate-900/40 rounded-2xl border border-white/5">
                            <div>
                                <span class="text-xs text-slate-400 flex items-center gap-1"><i data-lucide="arrow-up" class="w-3 h-3 text-red-400"></i> High</span>
                                <p id="highTemp" class="text-base font-semibold text-slate-200 mt-0.5">--</p>
                            </div>
                            <div>
                                <span class="text-xs text-slate-400 flex items-center gap-1"><i data-lucide="arrow-down" class="w-3 h-3 text-blue-400"></i> Low</span>
                                <p id="lowTemp" class="text-base font-semibold text-slate-200 mt-0.5">--</p>
                            </div>
                            <div>
                                <span class="text-xs text-slate-400 flex items-center gap-1"><i data-lucide="cloud-rain" class="w-3 h-3 text-blue-400"></i> Rain</span>
                                <p id="precipProb" class="text-base font-semibold text-slate-200 mt-0.5">--%</p>
                            </div>
                            <div>
                                <span class="text-xs text-slate-400 flex items-center gap-1"><i data-lucide="wind" class="w-3 h-3 text-teal-400"></i> Wind</span>
                                <p id="windSpeed" class="text-base font-semibold text-slate-200 mt-0.5">--</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Temperature Trend Chart -->
                <div class="glass-panel rounded-3xl p-6">
                    <h3 class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
                        <i data-lucide="trending-up" class="w-4 h-4 text-indigo-400"></i>
                        24-Hour Temperature Trend
                    </h3>
                    <div class="h-48 w-full">
                        <canvas id="tempChart"></canvas>
                    </div>
                </div>

            </div>

            <!-- Right Column: 7-Day Forecast & Air Quality (1 col on LG) -->
            <div class="flex flex-col gap-6">

                <!-- 7-Day Daily Forecast Card -->
                <div class="glass-panel rounded-3xl p-6 flex-1 flex flex-col justify-between">
                    <div>
                        <h3 class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
                            <i data-lucide="calendar" class="w-4 h-4 text-indigo-400"></i>
                            7-Day Forecast
                        </h3>
                        <div id="dailyContainer" class="flex flex-col divide-y divide-white/5">
                            <!-- Dynamic 7-day items populated here -->
                        </div>
                    </div>
                </div>

                <!-- Sun & Moon Info Card -->
                <div class="glass-panel rounded-3xl p-6">
                    <h3 class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
                        <i data-lucide="sunrise" class="w-4 h-4 text-amber-400"></i>
                        Sun & Elevation
                    </h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex items-center gap-3 p-3 bg-slate-900/40 rounded-2xl border border-white/5">
                            <div class="p-2.5 bg-amber-500/10 rounded-xl text-amber-400">
                                <i data-lucide="sunrise" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <span class="text-[11px] text-slate-400 block">Sunrise</span>
                                <span id="sunriseTime" class="text-sm font-semibold text-slate-200">--</span>
                            </div>
                        </div>

                        <div class="flex items-center gap-3 p-3 bg-slate-900/40 rounded-2xl border border-white/5">
                            <div class="p-2.5 bg-indigo-500/10 rounded-xl text-indigo-400">
                                <i data-lucide="sunset" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <span class="text-[11px] text-slate-400 block">Sunset</span>
                                <span id="sunsetTime" class="text-sm font-semibold text-slate-200">--</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <script>
        // State Management
        let currentUnit = 'fahrenheit'; // 'celsius' or 'fahrenheit' - Default to Fahrenheit
        let currentCoords = { lat: 51.5074, lon: -0.1278, name: 'London', country: 'United Kingdom' }; // Default London
        let weatherDataRaw = null;
        let chartInstance = null;
        let searchDebounceTimer = null;

        // WMO Weather Interpretation Codes
        const WMO_CODES = {
            0: { label: 'Clear sky', icon: 'sun', color: 'text-amber-400' },
            1: { label: 'Mainly clear', icon: 'cloud-sun', color: 'text-amber-300' },
            2: { label: 'Partly cloudy', icon: 'cloud-sun', color: 'text-slate-300' },
            3: { label: 'Overcast', icon: 'cloud', color: 'text-slate-400' },
            45: { label: 'Fog', icon: 'cloud-fog', color: 'text-slate-400' },
            48: { label: 'Depositing rime fog', icon: 'cloud-fog', color: 'text-slate-400' },
            51: { label: 'Light drizzle', icon: 'cloud-drizzle', color: 'text-blue-300' },
            53: { label: 'Moderate drizzle', icon: 'cloud-drizzle', color: 'text-blue-400' },
            55: { label: 'Dense drizzle', icon: 'cloud-drizzle', color: 'text-blue-500' },
            61: { label: 'Slight rain', icon: 'cloud-rain', color: 'text-blue-400' },
            63: { label: 'Moderate rain', icon: 'cloud-rain', color: 'text-blue-500' },
            65: { label: 'Heavy rain', icon: 'cloud-rain', color: 'text-indigo-400' },
            71: { label: 'Slight snow', icon: 'snowflake', color: 'text-cyan-200' },
            73: { label: 'Moderate snow', icon: 'snowflake', color: 'text-cyan-300' },
            75: { label: 'Heavy snow', icon: 'snowflake', color: 'text-cyan-400' },
            80: { label: 'Slight rain showers', icon: 'cloud-rain', color: 'text-blue-400' },
            81: { label: 'Moderate rain showers', icon: 'cloud-rain', color: 'text-blue-500' },
            82: { label: 'Violent rain showers', icon: 'cloud-lightning', color: 'text-purple-400' },
            95: { label: 'Thunderstorm', icon: 'cloud-lightning', color: 'text-yellow-400' },
            96: { label: 'Thunderstorm with hail', icon: 'cloud-lightning', color: 'text-yellow-500' }
        };

        // DOM Elements
        const cityInput = document.getElementById('cityInput');
        const clearSearchBtn = document.getElementById('clearSearch');
        const searchResults = document.getElementById('searchResults');
        const locBtn = document.getElementById('locBtn');
        const celsiusBtn = document.getElementById('celsiusBtn');
        const fahrenheitBtn = document.getElementById('fahrenheitBtn');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const weatherContent = document.getElementById('weatherContent');

        // Initialization
        window.onload = function() {
            lucide.createIcons();
            setupEventListeners();
            
            // First attempt to detect location via IP address lookup
            detectIPLocation();
        };

        // Detect user location via IP address API
        async function detectIPLocation() {
            showLoading();
            try {
                const response = await fetch('https://ipapi.co/json/');
                if (response.ok) {
                    const data = await response.json();
                    if (data.latitude && data.longitude) {
                        currentCoords = {
                            lat: data.latitude,
                            lon: data.longitude,
                            name: data.city || 'Local Area',
                            country: data.country_code || 'IP'
                        };
                        fetchWeatherData(currentCoords.lat, currentCoords.lon, currentCoords.name, currentCoords.country);
                        return;
                    }
                }
            } catch (err) {
                console.warn("IP location lookup failed, trying browser geolocation fallback...", err);
            }

            // Fallback: Browser Geolocation or Default London
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        reverseGeocode(pos.coords.latitude, pos.coords.longitude);
                    },
                    () => {
                        fetchDefaultCity();
                    }
                );
            } else {
                fetchDefaultCity();
            }
        }

        function setupEventListeners() {
            // Unit Switchers
            celsiusBtn.addEventListener('click', () => setUnit('celsius'));
            fahrenheitBtn.addEventListener('click', () => setUnit('fahrenheit'));

            // Search Input with Debounce
            cityInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                if (query.length > 0) {
                    clearSearchBtn.classList.remove('hidden');
                } else {
                    clearSearchBtn.classList.add('hidden');
                    searchResults.classList.add('hidden');
                }

                clearTimeout(searchDebounceTimer);
                if (query.length >= 2) {
                    searchDebounceTimer = setTimeout(() => handleSearch(query), 300);
                }
            });

            clearSearchBtn.addEventListener('click', () => {
                cityInput.value = '';
                clearSearchBtn.classList.add('hidden');
                searchResults.classList.add('hidden');
                cityInput.focus();
            });

            // Geolocation Button
            locBtn.addEventListener('click', () => {
                detectIPLocation();
            });

            // Hide search suggestions on click outside
            document.addEventListener('click', (e) => {
                if (!cityInput.contains(e.target) && !searchResults.contains(e.target)) {
                    searchResults.classList.add('hidden');
                }
            });
        }

        function setUnit(unit) {
            if (currentUnit === unit) return;
            currentUnit = unit;
            if (unit === 'celsius') {
                celsiusBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition";
                fahrenheitBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition";
            } else {
                fahrenheitBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition";
                celsiusBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition";
            }
            if (weatherDataRaw) {
                renderUI(weatherDataRaw);
            }
        }

        // Helper Temperature Converter
        function formatTemp(valInCelsius) {
            if (valInCelsius === null || valInCelsius === undefined) return '--';
            if (currentUnit === 'fahrenheit') {
                return Math.round((valInCelsius * 9/5) + 32);
            }
            return Math.round(valInCelsius);
        }

        // Helper Wind Speed Converter
        function formatWindSpeed(speedKmh) {
            if (speedKmh === null || speedKmh === undefined) return '--';
            if (currentUnit === 'fahrenheit') {
                // Convert km/h to mph (1 km/h = 0.621371 mph)
                const speedMph = Math.round(speedKmh * 0.621371);
                return `${speedMph} mph`;
            }
            return `${Math.round(speedKmh)} km/h`;
        }

        // Fetch Location Suggestions via Open-Meteo Geocoding API
        async function handleSearch(query) {
            try {
                const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=en&format=json`);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    renderSearchResults(data.results);
                } else {
                    searchResults.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">No locations found</div>`;
                    searchResults.classList.remove('hidden');
                }
            } catch (err) {
                console.error("Geocoding search error:", err);
            }
        }

        function renderSearchResults(results) {
            searchResults.innerHTML = '';
            results.forEach(loc => {
                const item = document.createElement('div');
                item.className = 'p-3 hover:bg-white/10 cursor-pointer text-xs flex justify-between items-center border-b border-white/5 last:border-0';
                item.innerHTML = `
                    <div>
                        <span class="font-semibold text-white">${loc.name}</span>
                        <span class="text-slate-400 ml-1">${loc.admin1 ? loc.admin1 + ',' : ''} ${loc.country || ''}</span>
                    </div>
                    <span class="text-[10px] text-slate-500">${loc.latitude.toFixed(2)}, ${loc.longitude.toFixed(2)}</span>
                `;
                item.addEventListener('click', () => {
                    currentCoords = {
                        lat: loc.latitude,
                        lon: loc.longitude,
                        name: loc.name,
                        country: loc.country_code ? loc.country_code.toUpperCase() : ''
                    };
                    cityInput.value = '';
                    clearSearchBtn.classList.add('hidden');
                    searchResults.classList.add('hidden');
                    fetchWeatherData(currentCoords.lat, currentCoords.lon, currentCoords.name, currentCoords.country);
                });
                searchResults.appendChild(item);
            });
            searchResults.classList.remove('hidden');
        }

        // Reverse Geocode fallback
        async function reverseGeocode(lat, lon) {
            try {
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${lat.toFixed(2)},${lon.toFixed(2)}&count=1`);
                fetchWeatherData(lat, lon, "Your Location", "GPS");
            } catch {
                fetchWeatherData(lat, lon, "Your Location", "GPS");
            }
        }

        // Fetch Main Weather Data from Open-Meteo
        async function fetchWeatherData(lat, lon, cityName, country) {
            showLoading();
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,surface_pressure,wind_speed_10m,visibility&hourly=temperature_2m,relative_humidity_2m,dew_point_2m,precipitation_probability,precipitation,weather_code,uv_index&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,precipitation_sum&timezone=auto`;
                
                const response = await fetch(url);
                if (!response.ok) throw new Error("Weather request failed.");

                const data = await response.json();
                weatherDataRaw = data;
                currentCoords.name = cityName;
                currentCoords.country = country;

                // Auto-detect unit based on country code (US -> Fahrenheit, Others -> Celsius)
                if (country && country.toUpperCase() === 'US') {
                    currentUnit = 'fahrenheit';
                    fahrenheitBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition";
                    celsiusBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition";
                } else {
                    currentUnit = 'celsius';
                    celsiusBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition";
                    fahrenheitBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition";
                }

                renderUI(data);
                hideLoading();
            } catch (error) {
                console.warn("Error fetching weather for location, falling back to New York...", error);
                // Fallback to New York (Lat: 40.7128, Lon: -74.0060)
                if (cityName !== 'New York') {
                    fetchWeatherData(40.7128, -74.0060, 'New York', 'US');
                } else {
                    showError("Unable to retrieve weather data. Please try again.");
                }
            }
        }

        function fetchDefaultCity() {
            fetchWeatherData(40.7128, -74.0060, 'New York', 'US');
        }

        // Render Data into UI
        function renderUI(data) {
            const current = data.current;
            const daily = data.daily;
            const hourly = data.hourly;
            const wmo = WMO_CODES[current.weather_code] || { label: 'Unknown', icon: 'cloud', color: 'text-slate-300' };

            // Helper to safely set text content if element exists
            const setElemText = (id, text) => {
                const el = document.getElementById(id);
                if (el) el.textContent = text;
            };

            // Location Header
            setElemText('cityName', currentCoords.name);
            setElemText('countryCode', currentCoords.country || '');
            
            // Format current date
            const dateObj = new Date();
            const dateOptions = { weekday: 'long', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            setElemText('currentDate', dateObj.toLocaleDateString('en-US', dateOptions));

            // Condition Tag
            setElemText('weatherConditionTag', wmo.label);

            // Temps - Primary large temp displays Feels Like
            setElemText('currentTemp', formatTemp(current.apparent_temperature));
            setElemText('tempUnitDisplay', currentUnit === 'fahrenheit' ? '°F' : '°C');

            // Main Icon
            const iconContainer = document.getElementById('currentIconContainer');
            if (iconContainer) {
                iconContainer.className = `p-4 bg-white/5 rounded-2xl border border-white/10 ${wmo.color}`;
                iconContainer.innerHTML = `<i data-lucide="${wmo.icon}" class="w-16 h-16 sm:w-20 sm:h-20"></i>`;
            }

            // High/Low & Rain Chance
            setElemText('highTemp', `${formatTemp(daily.temperature_2m_max[0])}°`);
            setElemText('lowTemp', `${formatTemp(daily.temperature_2m_min[0])}°`);
            
            const maxRainChance = daily.precipitation_probability_max ? daily.precipitation_probability_max[0] : (hourly.precipitation_probability ? hourly.precipitation_probability[0] : 0);
            setElemText('precipProb', `${maxRainChance}%`);

            setElemText('windSpeed', formatWindSpeed(current.wind_speed_10m));

            // Sun Times
            if (daily.sunrise && daily.sunrise[0]) {
                const sRise = new Date(daily.sunrise[0]);
                setElemText('sunriseTime', sRise.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
            }
            if (daily.sunset && daily.sunset[0]) {
                const sSet = new Date(daily.sunset[0]);
                setElemText('sunsetTime', sSet.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
            }

            // Render Sub-components
            renderDaily(daily);
            renderChart(hourly);

            lucide.createIcons();
        }

        // Render 7-Day Forecast Rows
        function renderDaily(daily) {
            const container = document.getElementById('dailyContainer');
            container.innerHTML = '';

            for (let i = 0; i < daily.time.length; i++) {
                const date = new Date(daily.time[i] + 'T00:00:00');
                const dayName = i === 0 ? 'Today' : date.toLocaleDateString('en-US', { weekday: 'short' });
                const code = daily.weather_code[i];
                const wmo = WMO_CODES[code] || { label: 'Clear', icon: 'sun', color: 'text-amber-400' };
                const rainChance = daily.precipitation_probability_max ? daily.precipitation_probability_max[i] || 0 : 0;

                const row = document.createElement('div');
                row.className = 'py-3.5 flex items-center justify-between text-sm';
                row.innerHTML = `
                    <span class="w-20 font-medium text-slate-200">${dayName}</span>
                    <div class="flex items-center gap-2 w-28">
                        <div class="${wmo.color}">
                            <i data-lucide="${wmo.icon}" class="w-5 h-5"></i>
                        </div>
                        <span class="text-xs text-slate-400 truncate">${wmo.label}</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-1.5 bg-blue-950/40 px-2 py-0.5 rounded-lg border border-blue-500/20 min-w-[55px] justify-center">
                            <i data-lucide="cloud-rain" class="w-3 h-3 text-blue-400"></i>
                            <span class="text-xs text-blue-300 font-semibold">${rainChance}%</span>
                        </div>
                        <div class="flex items-center gap-2 text-right">
                            <span class="font-semibold text-white">${formatTemp(daily.temperature_2m_max[i])}°</span>
                            <span class="text-xs text-slate-400">${formatTemp(daily.temperature_2m_min[i])}°</span>
                        </div>
                    </div>
                `;
                container.appendChild(row);
            }
        }

        // Chart.js 24-Hour Temperature Trend Graph
        function renderChart(hourly) {
            const ctx = document.getElementById('tempChart').getContext('2d');
            
            const labels = hourly.time.slice(0, 24).map(t => {
                const d = new Date(t);
                return d.toLocaleTimeString([], { hour: '2-digit' });
            });

            const temps = hourly.temperature_2m.slice(0, 24).map(t => formatTemp(t));

            if (chartInstance) {
                chartInstance.destroy();
            }

            // Gradient line background
            const gradient = ctx.createLinearGradient(0, 0, 0, 200);
            gradient.addColorStop(0, 'rgba(99, 102, 241, 0.4)');
            gradient.addColorStop(1, 'rgba(99, 102, 241, 0.0)');

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `Temperature (${currentUnit === 'celsius' ? '°C' : '°F'})`,
                        data: temps,
                        borderColor: '#818cf8',
                        borderWidth: 2,
                        fill: true,
                        backgroundColor: gradient,
                        tension: 0.4,
                        pointRadius: 2,
                        pointHoverRadius: 5,
                        pointHoverBackgroundColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#cbd5e1',
                            bodyColor: '#f8fafc',
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8', font: { size: 10 } }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#94a3b8', font: { size: 10 } }
                        }
                    }
                }
            });
        }

        function getUvStatus(uv) {
            if (uv <= 2) return 'Low';
            if (uv <= 5) return 'Moderate';
            if (uv <= 7) return 'High';
            if (uv <= 10) return 'Very High';
            return 'Extreme';
        }

        function showLoading() {
            loadingState.classList.remove('hidden');
            weatherContent.classList.add('hidden');
            errorState.classList.add('hidden');
        }

        function hideLoading() {
            loadingState.classList.add('hidden');
            weatherContent.classList.remove('hidden');
        }

        function showError(msg) {
            loadingState.classList.add('hidden');
            weatherContent.classList.add('hidden');
            errorState.classList.remove('hidden');
            document.getElementById('errorMessage').textContent = msg;
        }
    </script>
</body>
</html>
