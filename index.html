<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather No Ads</title>
  <meta name="description" content="Fast, ad-free weather forecasts powered by Open-Meteo.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Inter, sans-serif;
      background: linear-gradient(135deg,#0f172a,#1e1b4b,#311042);
      min-height: 100vh;
      color: #f8fafc;
    }
    .glass-panel {
      background: rgba(30,41,59,.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.1);
    }
  </style>
</head>
<body class="p-4 md:p-8 flex flex-col min-h-screen">

<header class="max-w-7xl mx-auto w-full mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
  <div class="flex items-center gap-3">
    <div class="p-3 bg-indigo-600/30 rounded-2xl text-indigo-400">
      <i data-lucide="cloud-sun" class="w-8 h-8"></i>
    </div>
    <div>
      <h1 class="text-2xl font-bold">Weather No Ads</h1>
      <p class="text-xs text-slate-400">Powered by Open-Meteo</p>
    </div>
  </div>

  <div class="flex items-center gap-3 w-full md:w-auto">
    <div class="relative flex-1 md:w-80">
      <input id="cityInput" type="text"
        placeholder="Search city or location..."
        autocomplete="off"
        class="w-full p-3 rounded-xl glass-panel text-sm outline-none">
      <div id="searchResults"
        class="hidden absolute top-full left-0 right-0 mt-2 z-50 glass-panel rounded-xl overflow-hidden"></div>
    </div>

    <div class="flex items-center bg-slate-900/60 p-1 rounded-xl border border-white/10">
      <button id="celsiusBtn" class="px-3 py-2 rounded-lg text-xs">°C</button>
      <button id="fahrenheitBtn" class="px-3 py-2 rounded-lg text-xs bg-indigo-600">°F</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto w-full flex-1 flex flex-col gap-6">

  <div id="loadingState" class="flex flex-col items-center justify-center py-20 gap-4">
    <div class="w-12 h-12 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
    <p id="loadingMessage" class="text-sm text-slate-400">Detecting your approximate location...</p>
  </div>

  <div id="welcomeState" class="hidden glass-panel p-10 rounded-3xl text-center">
    <h3 class="text-xl font-bold mb-3">Welcome to Weather No Ads</h3>
    <p id="welcomeMessage" class="text-sm text-slate-300">Search for a city to see the forecast.</p>
    <button id="retryBtn" class="mt-4 px-4 py-2 bg-indigo-600 rounded-xl text-sm">Try again</button>
  </div>

  <div id="errorState" class="hidden glass-panel p-6 rounded-2xl text-center">
    <h3 class="text-lg font-semibold mb-2">Weather Error</h3>
    <p id="errorMessage" class="text-sm text-slate-300"></p>
  </div>

  <div id="weatherContent" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">

    <div class="lg:col-span-2 flex flex-col gap-6">

      <section class="glass-panel rounded-3xl p-6 sm:p-8">
        <div class="flex justify-between items-start mb-6">
          <div>
            <h2 class="text-2xl sm:text-3xl font-bold">
              <span id="cityName">--</span>
              <span id="countryCode" class="text-sm text-slate-400"></span>
            </h2>
            <p id="currentDate" class="text-sm text-slate-400 mt-1"></p>
          </div>
          <span id="weatherConditionTag" class="text-sm text-indigo-300"></span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 items-center">
          <div class="flex items-center gap-4">
            <div id="currentIconContainer" class="p-4 text-yellow-400">
              <i data-lucide="sun" class="w-16 h-16"></i>
            </div>
            <div class="text-5xl sm:text-7xl font-bold">
              <span id="currentTemp">--</span><span id="tempUnitDisplay" class="text-2xl text-indigo-400">°F</span>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4 p-4 bg-slate-900/40 rounded-2xl">
            <div><span class="text-xs text-slate-400">High</span><p id="highTemp" class="font-semibold">--</p></div>
            <div><span class="text-xs text-slate-400">Low</span><p id="lowTemp" class="font-semibold">--</p></div>
            <div><span class="text-xs text-slate-400">Rain chance</span><p id="precipProb" class="font-semibold">--%</p></div>
            <div><span class="text-xs text-slate-400">Wind</span><p id="windSpeed" class="font-semibold">--</p></div>
          </div>
        </div>
      </section>

      <section class="glass-panel rounded-3xl p-6">
        <h3 class="text-sm font-semibold mb-4">24-Hour Temperature Trend</h3>
        <div class="h-48"><canvas id="tempChart"></canvas></div>
      </section>
    </div>

    <div class="flex flex-col gap-6">
      <section class="glass-panel rounded-3xl p-6">
        <h3 class="text-sm font-semibold mb-4">7-Day Forecast</h3>
        <div id="dailyContainer" class="divide-y divide-white/5"></div>
      </section>

      <section class="glass-panel rounded-3xl p-6">
        <h3 class="text-sm font-semibold mb-4">Sun Schedule</h3>
        <div class="grid grid-cols-2 gap-4">
          <div class="p-3 bg-slate-900/40 rounded-xl">
            <span class="text-xs text-slate-400">Sunrise</span>
            <p id="sunriseTime">--</p>
          </div>
          <div class="p-3 bg-slate-900/40 rounded-xl">
            <span class="text-xs text-slate-400">Sunset</span>
            <p id="sunsetTime">--</p>
          </div>
        </div>
      </section>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);

let currentUnit = 'fahrenheit';
let currentCoords = null;
let weatherDataRaw = null;
let chartInstance = null;
let searchTimer = null;
let requestVersion = 0;

const WMO_CODES = {
  0:{label:'Clear Sky',icon:'sun'},
  1:{label:'Mainly Clear',icon:'sun'},
  2:{label:'Partly Cloudy',icon:'cloud-sun'},
  3:{label:'Overcast',icon:'cloud'},
  45:{label:'Foggy',icon:'cloud-fog'},
  48:{label:'Rime Fog',icon:'cloud-fog'},
  51:{label:'Light Drizzle',icon:'cloud-rain'},
  53:{label:'Moderate Drizzle',icon:'cloud-rain'},
  55:{label:'Dense Drizzle',icon:'cloud-rain'},
  56:{label:'Freezing Drizzle',icon:'cloud-snow'},
  57:{label:'Freezing Drizzle',icon:'cloud-snow'},
  61:{label:'Slight Rain',icon:'cloud-rain'},
  63:{label:'Moderate Rain',icon:'cloud-rain'},
  65:{label:'Heavy Rain',icon:'cloud-rain'},
  66:{label:'Freezing Rain',icon:'cloud-snow'},
  67:{label:'Heavy Freezing Rain',icon:'cloud-snow'},
  71:{label:'Slight Snow',icon:'snowflake'},
  73:{label:'Moderate Snow',icon:'snowflake'},
  75:{label:'Heavy Snow',icon:'snowflake'},
  77:{label:'Snow Grains',icon:'snowflake'},
  80:{label:'Rain Showers',icon:'cloud-rain'},
  81:{label:'Moderate Showers',icon:'cloud-rain'},
  82:{label:'Heavy Showers',icon:'cloud-rain'},
  85:{label:'Snow Showers',icon:'snowflake'},
  86:{label:'Heavy Snow Showers',icon:'snowflake'},
  95:{label:'Thunderstorm',icon:'cloud-lightning'},
  96:{label:'Thunderstorm with Hail',icon:'cloud-lightning'},
  99:{label:'Severe Thunderstorm',icon:'cloud-lightning'}
};

const cityInput = $('cityInput');
const searchResults = $('searchResults');
const celsiusBtn = $('celsiusBtn');
const fahrenheitBtn = $('fahrenheitBtn');

function setup() {
  lucide.createIcons();

  celsiusBtn.addEventListener('click', () => setUnit('celsius'));
  fahrenheitBtn.addEventListener('click', () => setUnit('fahrenheit'));

  cityInput.addEventListener('input', () => {
    const query = cityInput.value.trim();
    if (!query) {
      searchResults.classList.add('hidden');
      return;
    }
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => fetchCitySuggestions(query), 300);
  });

  $('retryBtn').addEventListener('click', locateByIP);

  document.addEventListener('click', e => {
    if (!cityInput.contains(e.target) && !searchResults.contains(e.target)) {
      searchResults.classList.add('hidden');
    }
  });

  locateByIP();
}

async function locateByIP() {
  const version = ++requestVersion;
  showLoading('Detecting your approximate location...');

  try {
    const response = await fetch('https://ipapi.co/json/');
    if (!response.ok) throw new Error('IP lookup failed');

    const loc = await response.json();
    const lat = Number(loc.latitude);
    const lon = Number(loc.longitude);

    if (loc.error || !Number.isFinite(lat) || !Number.isFinite(lon)) {
      throw new Error('Location unavailable');
    }

    if (version !== requestVersion) return;

    await fetchWeatherData(
      lat, lon,
      loc.city || loc.region || 'Your Location',
      loc.country_code || '',
      version
    );
  } catch (error) {
    console.error(error);
    if (version !== requestVersion) return;
    showWelcome('Automatic location failed. Search for your city instead.');
  }
}

async function fetchCitySuggestions(query) {
  try {
    const response = await fetch(
      'https://geocoding-api.open-meteo.com/v1/search?name=' +
      encodeURIComponent(query) + '&count=6&language=en&format=json'
    );

    if (!response.ok) throw new Error('Search failed');
    const data = await response.json();

    searchResults.innerHTML = '';

    if (!data.results?.length) {
      searchResults.innerHTML =
        '<div class="p-3 text-sm text-slate-400">No locations found</div>';
      searchResults.classList.remove('hidden');
      return;
    }

    data.results.forEach(place => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className =
        'block w-full text-left p-3 text-sm hover:bg-white/10 border-b border-white/5';

      button.textContent = [
        place.name, place.admin1, place.country
      ].filter(Boolean).join(', ');

      button.addEventListener('click', () => {
        cityInput.value = button.textContent;
        searchResults.classList.add('hidden');

        setUnit(
          place.country_code?.toUpperCase() === 'US'
            ? 'fahrenheit'
            : 'celsius'
        );

        fetchWeatherData(
          place.latitude,
          place.longitude,
          place.name,
          place.country_code || ''
        );
      });

      searchResults.appendChild(button);
    });

    searchResults.classList.remove('hidden');
  } catch (error) {
    console.error(error);
  }
}

function setUnit(unit) {
  currentUnit = unit;

  celsiusBtn.className =
    'px-3 py-2 rounded-lg text-xs ' +
    (unit === 'celsius' ? 'bg-indigo-600' : '');

  fahrenheitBtn.className =
    'px-3 py-2 rounded-lg text-xs ' +
    (unit === 'fahrenheit' ? 'bg-indigo-600' : '');

  if (currentCoords) {
    fetchWeatherData(
      currentCoords.lat,
      currentCoords.lon,
      currentCoords.cityName,
      currentCoords.countryCode
    );
  }
}

async function fetchWeatherData(lat, lon, cityName, countryCode, version = ++requestVersion) {
  showLoading('Fetching fresh weather data...');

  currentCoords = {lat, lon, cityName, countryCode};

  const params = new URLSearchParams({
    latitude: lat,
    longitude: lon,
    current: 'apparent_temperature,precipitation,weather_code,wind_speed_10m',
    hourly: 'temperature_2m',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max',
    temperature_unit: currentUnit,
    wind_speed_unit: currentUnit === 'fahrenheit' ? 'mph' : 'kmh',
    precipitation_unit: currentUnit === 'fahrenheit' ? 'inch' : 'mm',
    timezone: 'auto',
    forecast_days: '8'
  });

  try {
    const response = await fetch(
      'https://api.open-meteo.com/v1/forecast?' + params
    );

    if (!response.ok) throw new Error('Weather request failed');

    const data = await response.json();

    if (version !== requestVersion) return;

    weatherDataRaw = {data, cityName, countryCode};
    renderWeatherData(weatherDataRaw);
    hideLoading();
  } catch (error) {
    console.error(error);
    if (version === requestVersion) {
      showError('Unable to load weather. Please try another city.');
    }
  }
}

function renderWeatherData(payload) {
  const {data, cityName, countryCode} = payload;
  const current = data.current;
  const daily = data.daily;

  $('cityName').textContent = cityName;
  $('countryCode').textContent = countryCode ? ' ' + countryCode : '';
  $('currentDate').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'short', day: 'numeric'
  });

  const info = WMO_CODES[current.weather_code] ||
    {label: 'Unknown conditions', icon: 'cloud'};

  $('weatherConditionTag').textContent = info.label;
  $('currentIconContainer').innerHTML =
    `<i data-lucide="${info.icon}" class="w-16 h-16"></i>`;

  const unit = currentUnit === 'fahrenheit' ? '°F' : '°C';
  $('tempUnitDisplay').textContent = unit;
  $('currentTemp').textContent = Math.round(current.apparent_temperature);
  $('highTemp').textContent = Math.round(daily.temperature_2m_max[0]) + '°';
  $('lowTemp').textContent = Math.round(daily.temperature_2m_min[0]) + '°';
  $('precipProb').textContent =
    (daily.precipitation_probability_max?.[0] ?? 0) + '%';

  $('windSpeed').textContent =
    Math.round(current.wind_speed_10m) +
    (currentUnit === 'fahrenheit' ? ' mph' : ' km/h');

  $('sunriseTime').textContent = formatTime(daily.sunrise?.[0]);
  $('sunsetTime').textContent = formatTime(daily.sunset?.[0]);

  renderTempChart(data.hourly);
  renderDailyForecast(daily);
  lucide.createIcons();
}

function formatTime(value) {
  if (!value) return '--';
  return new Date(value).toLocaleTimeString('en-US', {
    hour: 'numeric', minute: '2-digit', hour12: true
  });
}

function renderTempChart(hourly) {
  const now = new Date();
  let start = hourly.time.findIndex(t => new Date(t) >= now);
  if (start < 0) start = 0;

  const labels = [];
  const temps = [];

  for (let i = 0; i < 24 && start + i < hourly.time.length; i++) {
    labels.push(new Date(hourly.time[start + i]).toLocaleTimeString('en-US', {
      hour: 'numeric'
    }));
    temps.push(hourly.temperature_2m[start + i]);
  }

  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart($('tempChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Temperature',
        data: temps,
        borderColor: '#818cf8',
        backgroundColor: 'rgba(129,140,248,.1)',
        borderWidth: 3,
        fill: true,
        tension: .4,
        pointRadius: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {legend: {display: false}},
      scales: {
        x: {ticks: {color: '#94a3b8', maxTicksLimit: 8}},
        y: {ticks: {color: '#94a3b8'}}
      }
    }
  });
}

function renderDailyForecast(daily) {
  const container = $('dailyContainer');
  container.innerHTML = '';

  // Index 0 is TODAY. Start at index 1 and display the next 7 days.
  for (let i = 1; i <= 7 && i < daily.time.length; i++) {
    const date = new Date(daily.time[i] + 'T12:00:00');
    const dayName = date.toLocaleDateString('en-US', {weekday: 'short'});
    const info = WMO_CODES[daily.weather_code[i]] ||
      {label: 'Unknown', icon: 'cloud'};

    const row = document.createElement('div');
    row.className = 'py-3 flex items-center justify-between gap-2';

    const day = document.createElement('span');
    day.className = 'w-12 text-sm font-medium';
    day.textContent = dayName;

    const condition = document.createElement('div');
    condition.className = 'flex items-center gap-2 text-slate-300';

    const icon = document.createElement('i');
    icon.setAttribute('data-lucide', info.icon);
    icon.className = 'w-5 h-5 text-indigo-400';

    const label = document.createElement('span');
    label.className = 'text-xs text-slate-400 hidden sm:inline';
    label.textContent = info.label;

    condition.append(icon, label);

    const metrics = document.createElement('div');
    metrics.className = 'flex items-center gap-3 text-right';

    const rain = document.createElement('span');
    rain.className = 'text-xs text-slate-400';
    rain.textContent =
      (daily.precipitation_probability_max?.[i] ?? 0) + '% rain';

    const temps = document.createElement('span');
    temps.className = 'text-sm';

    const high = document.createElement('strong');
    high.textContent = Math.round(daily.temperature_2m_max[i]) + '°';

    const low = document.createElement('span');
    low.className = 'text-slate-400 ml-2';
    low.textContent = Math.round(daily.temperature_2m_min[i]) + '°';

    temps.append(high, low);
    metrics.append(rain, temps);
    row.append(day, condition, metrics);
    container.appendChild(row);
  }

  lucide.createIcons();
}

function showLoading(message) {
  $('loadingMessage').textContent = message;
  $('loadingState').classList.remove('hidden');
  $('welcomeState').classList.add('hidden');
  $('errorState').classList.add('hidden');
  $('weatherContent').classList.add('hidden');
}

function hideLoading() {
  $('loadingState').classList.add('hidden');
  $('welcomeState').classList.add('hidden');
  $('errorState').classList.add('hidden');
  $('weatherContent').classList.remove('hidden');
}

function showWelcome(message) {
  $('loadingState').classList.add('hidden');
  $('errorState').classList.add('hidden');
  $('weatherContent').classList.add('hidden');
  $('welcomeState').classList.remove('hidden');
  $('welcomeMessage').textContent = message;
}

function showError(message) {
  $('loadingState').classList.add('hidden');
  $('welcomeState').classList.add('hidden');
  $('weatherContent').classList.add('hidden');
  $('errorState').classList.remove('hidden');
  $('errorMessage').textContent = message;
}

document.addEventListener('DOMContentLoaded', setup);
</script>
</body>
</html>
